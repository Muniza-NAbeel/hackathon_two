apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  namespace: todo-app
  labels:
    app: chat-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-backend
  template:
    metadata:
      labels:
        app: chat-backend
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "chat-backend"
        dapr.io/app-port: "8000"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: chat-backend
          image: chat-backend:latest
          imagePullPolicy: IfNotPresent  # Use local images in Minikube
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chat-backend
  namespace: todo-app
spec:
  selector:
    app: chat-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
