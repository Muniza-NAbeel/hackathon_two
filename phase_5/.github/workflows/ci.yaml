name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'phase_5/**'
  pull_request:
    branches: [main]
    paths:
      - 'phase_5/**'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd phase_5/backend
          pip install ruff

      - name: Run Ruff
        run: |
          cd phase_5/backend
          ruff check app/

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd phase_5/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        run: |
          cd phase_5/backend
          pytest tests/ -v --cov=app --cov-report=xml
        env:
          EVENTS_ENABLED: "false"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"

  test-notification-service:
    name: Test Notification Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd phase_5/services/notification-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          cd phase_5/services/notification-service
          pytest tests/ -v || echo "No tests yet"

  test-recurring-task-service:
    name: Test Recurring Task Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd phase_5/services/recurring-task-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          cd phase_5/services/recurring-task-service
          pytest tests/ -v || echo "No tests yet"

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-notification-service, test-recurring-task-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./phase_5/backend
          push: false
          tags: chat-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Notification Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./phase_5/services/notification-service
          push: false
          tags: notification-service:${{ github.sha }}

      - name: Build Recurring Task Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./phase_5/services/recurring-task-service
          push: false
          tags: recurring-task-service:${{ github.sha }}
