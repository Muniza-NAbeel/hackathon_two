# Phase 4: Backend ConfigMap
# Non-sensitive environment variables for FastAPI backend
# Generated by Claude Code following Spec-Driven Development

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.fullname" . }}-config
  labels:
    {{- include "backend.labels" . | nindent 4 }}
data:
  JWT_ALGORITHM: {{ .Values.env.JWT_ALGORITHM | quote }}
  ACCESS_TOKEN_EXPIRE_DAYS: {{ .Values.env.ACCESS_TOKEN_EXPIRE_DAYS | quote }}
  DEBUG: {{ .Values.env.DEBUG | quote }}
  CORS_ORIGINS: {{ .Values.env.CORS_ORIGINS | quote }}
