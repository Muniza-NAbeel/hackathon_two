# Phase 4: Docker Compose for Local Development
# Use this for testing containers without Kubernetes
# Generated by Claude Code following Spec-Driven Development

version: '3.8'

services:
  # ==========================================================================
  # Backend Service - FastAPI + AI Agent
  # ==========================================================================
  backend:
    build:
      context: ../phase_3/backend
      dockerfile: ../../phase_4/backend/Dockerfile
    image: todo-backend:latest
    container_name: todo-backend
    ports:
      - "8000:8000"
    environment:
      # Database connection (required)
      - DATABASE_URL=${DATABASE_URL}
      # Google Gemini API key for AI chatbot (required)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # JWT authentication (required)
      - JWT_SECRET=${JWT_SECRET}
      # Optional configuration
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_DAYS=${ACCESS_TOKEN_EXPIRE_DAYS:-7}
      - DEBUG=${DEBUG:-False}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - todo-network

  # ==========================================================================
  # Frontend Service - Next.js AI Chatbot UI
  # ==========================================================================
  frontend:
    build:
      context: ../phase_3/frontend
      dockerfile: ../../phase_4/frontend/Dockerfile
    image: todo-frontend:latest
    container_name: todo-frontend
    ports:
      - "3000:3000"
    environment:
      # Backend API URL for frontend requests
      - NEXT_PUBLIC_API_URL=http://backend:8000
      # OpenAI domain key (if needed)
      - NEXT_PUBLIC_OPENAI_DOMAIN_KEY=${NEXT_PUBLIC_OPENAI_DOMAIN_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - todo-network

# ==========================================================================
# Networks
# ==========================================================================
networks:
  todo-network:
    driver: bridge
    name: todo-network
