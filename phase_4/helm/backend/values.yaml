# Phase 4: Backend Helm Values
# Configurable values for Kubernetes deployment
# Generated by Claude Code following Spec-Driven Development

# =============================================================================
# Image Configuration
# =============================================================================
image:
  repository: todo-backend
  tag: "latest"
  pullPolicy: Never  # Use local Minikube images

# =============================================================================
# Deployment Configuration
# =============================================================================
replicaCount: 1

# =============================================================================
# Service Configuration (FR-012)
# =============================================================================
service:
  type: NodePort
  port: 8000
  targetPort: 8000
  nodePort: 30080

# =============================================================================
# Resource Limits and Requests
# =============================================================================
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# =============================================================================
# Health Check Probes (FR-013)
# =============================================================================
probes:
  liveness:
    path: /health
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================================
# Environment Variables (Non-Sensitive via ConfigMap)
# Based on phase_3/backend/app/config.py Settings class
# =============================================================================
env:
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_DAYS: "7"
  DEBUG: "False"
  CORS_ORIGINS: '["http://localhost:3000"]'

# =============================================================================
# Secret Reference (Sensitive variables)
# =============================================================================
secretName: backend-secrets

# =============================================================================
# Pod Configuration
# =============================================================================
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# =============================================================================
# Node Selection
# =============================================================================
nodeSelector: {}
tolerations: []
affinity: {}
