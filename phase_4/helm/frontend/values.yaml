# Phase 4: Frontend Helm Values
# Configurable values for Kubernetes deployment
# Generated by Claude Code following Spec-Driven Development

# =============================================================================
# Image Configuration
# =============================================================================
image:
  repository: todo-frontend
  tag: "latest"
  pullPolicy: Never  # Use local Minikube images

# =============================================================================
# Deployment Configuration
# =============================================================================
replicaCount: 1

# =============================================================================
# Service Configuration (FR-012)
# =============================================================================
service:
  type: NodePort
  port: 3000
  targetPort: 3000
  nodePort: 30000

# =============================================================================
# Resource Limits and Requests
# =============================================================================
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

# =============================================================================
# Health Check Probes (FR-013)
# =============================================================================
probes:
  liveness:
    path: /
    port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /
    port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================================
# Environment Variables
# =============================================================================
env:
  NEXT_PUBLIC_API_URL: "http://127.0.0.1:30080"

# =============================================================================
# Pod Configuration
# =============================================================================
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

# =============================================================================
# Node Selection
# =============================================================================
nodeSelector: {}
tolerations: []
affinity: {}
