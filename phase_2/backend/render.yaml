# Render Blueprint - Phase 2 Backend Deployment
services:
  - type: web
    name: todo-backend-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-url.vercel.app,http://localhost:3000
      - key: DEBUG
        value: false
      - key: PORT
        value: 8000
    healthCheckPath: /health
